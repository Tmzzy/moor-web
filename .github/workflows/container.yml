name: Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: |
          pnpm lint
          pnpm test
          pnpm build:frontend

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Verify backend
        run: cargo test --locked --manifest-path backend/Cargo.toml

      - name: Build runtime smoke image
        run: docker build --tag moor-runtime-smoke .

      - name: Verify bundled runtimes and writable storage
        run: |
          docker run --rm --entrypoint /bin/sh moor-runtime-smoke -ec '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test "$HOME" = "/data/runtime/home"
            test "$(node --version | cut -d. -f1)" = "v24"
            case "$(uv --version)" in "uv 0.12.3 "*) ;; *) exit 1 ;; esac
            ! command -v python3 >/dev/null
            for command in node npm npx uv uvx; do command -v "$command" >/dev/null; done
            for directory in \
              "$HOME" \
              "$XDG_CACHE_HOME" \
              "$XDG_CONFIG_HOME" \
              "$XDG_DATA_HOME" \
              "$NPM_CONFIG_CACHE" \
              "$UV_CACHE_DIR" \
              "$UV_PYTHON_INSTALL_DIR" \
              "$UV_PYTHON_BIN_DIR" \
              "$UV_TOOL_DIR" \
              "$UV_TOOL_BIN_DIR"; do
              touch "$directory/.moor-write-test"
              rm "$directory/.moor-write-test"
            done
            uv python install 3.12
            python3.12 -c "import sys; assert sys.version_info[:2] == (3, 12)"
          '

      - name: Verify existing data volume upgrade
        run: |
          volume=moor-old-volume-smoke
          container=moor-old-volume-smoke
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume"
          docker run --rm \
            --user 0:0 \
            --volume "$volume:/legacy" \
            --entrypoint /bin/sh \
            moor-runtime-smoke -ec '
              touch /legacy/existing-marker
              chown -R 10001:10001 /legacy
            '

          docker run --detach \
            --name "$container" \
            --volume "$volume:/data" \
            --env MOOR_PASSWORD=runtime-smoke-password \
            --health-interval=1s \
            --health-timeout=5s \
            --health-start-period=1s \
            --health-retries=30 \
            moor-runtime-smoke

          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            test "$status" != unhealthy || break
            test "$status" != healthy || break
            sleep 1
          done
          if test "$status" != healthy; then
            docker logs "$container"
            exit 1
          fi

          docker exec "$container" /bin/sh -ec '
            test -f /data/existing-marker
            for directory in \
              "$HOME" \
              "$XDG_CACHE_HOME" \
              "$XDG_CONFIG_HOME" \
              "$XDG_DATA_HOME" \
              "$NPM_CONFIG_CACHE" \
              "$UV_CACHE_DIR" \
              "$UV_PYTHON_INSTALL_DIR" \
              "$UV_PYTHON_BIN_DIR" \
              "$UV_TOOL_DIR" \
              "$UV_TOOL_BIN_DIR"; do
              test -d "$directory"
              touch "$directory/.moor-upgrade-write-test"
              rm "$directory/.moor-upgrade-write-test"
            done
          '

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tmzzy/moor-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

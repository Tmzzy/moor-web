services:
  moor:
    image: ghcr.io/tmzzy/moor-web:latest
    restart: unless-stopped
    init: true
    ports:
      - "${MOOR_BIND_ADDRESS:-127.0.0.1}:${MOOR_HTTP_PORT:-9223}:9223"
    environment:
      MOOR_USERNAME: "${MOOR_USERNAME:-moor}"
      MOOR_PASSWORD: "${MOOR_PASSWORD:?Set MOOR_PASSWORD before starting Moor}"
      MOOR_PUBLIC_URL: "${MOOR_PUBLIC_URL:-http://localhost:9223}"
    volumes:
      - moor-data:/data
    stop_grace_period: 20s

volumes:
  moor-data:
